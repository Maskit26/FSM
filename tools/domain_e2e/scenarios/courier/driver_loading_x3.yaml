# Водитель: резерв 3 заказов → погрузка → ячейки → complete_loading
# (создаёт trip в domain + отдаёт data.trip_id).
#
# Предусловие: ≥3 order_parcel_confirmed на направлении
# (обычно после client_deposit_x3_to_direction.yaml на чистой БД).
#
# Сиды: user 1 = driver, city=Москва.
# Рейс дальше — scenarios/courier/driver_trip_lifecycle.yaml

name: driver_loading_x3
service_id: svc_courier_01
vars:
  driver_id: "1"
defaults:
  poll_timeout: 60
  poll_interval: 0.5

steps:
  - name: list_driver_exchange
    operation: list_driver_exchange
    actor: { actor_type: user, actor_id: "{{driver_id}}", channel: api }
    params: {}
    expect: { status_code: 200 }
    capture:
      from_city: data.directions.0.from_city
      to_city: data.directions.0.to_city

  - name: reserve_3
    operation: reserve_direction_slot
    actor: { actor_type: user, actor_id: "{{driver_id}}", channel: api }
    params:
      from_city: "{{from_city}}"
      to_city: "{{to_city}}"
      capacity: 3
    expect:
      status_code: 200
      body:
        data.status: reservation_active
        data.reserved_count: 3
    capture:
      reservation_id: data.reservation_id
      order_id_1: data.order_ids.0
      order_id_2: data.order_ids.1
      order_id_3: data.order_ids.2

  - name: start_loading
    operation: start_loading
    actor: { actor_type: user, actor_id: "{{driver_id}}", channel: api }
    params: { reservation_id: "{{reservation_id}}" }
    expect: { status_code: 200 }
    wait_instance: true
    expect_instance: { status: COMPLETED }

  # ----- заказ 1 -----
  - name: request_pin_1
    operation: request_locker_access_code
    actor: { actor_type: user, actor_id: "{{driver_id}}", channel: api }
    params: { order_id: "{{order_id_1}}", leg: pickup }
    expect: { status_code: 200 }
    capture: { pin_1: data.pin }

  - name: open_cell_1
    operation: open_cell
    actor: { actor_type: user, actor_id: "{{driver_id}}", channel: api }
    params: { order_id: "{{order_id_1}}", leg: pickup, pin: "{{pin_1}}" }
    expect: { status_code: 200 }
    wait_instance: true
    expect_instance: { status: COMPLETED }

  - name: close_cell_1
    operation: close_cell
    actor: { actor_type: user, actor_id: "{{driver_id}}", channel: api }
    params: { order_id: "{{order_id_1}}", leg: pickup }
    expect: { status_code: 200 }
    wait_instance: true
    expect_instance: { status: COMPLETED }

  # ----- заказ 2 -----
  - name: request_pin_2
    operation: request_locker_access_code
    actor: { actor_type: user, actor_id: "{{driver_id}}", channel: api }
    params: { order_id: "{{order_id_2}}", leg: pickup }
    expect: { status_code: 200 }
    capture: { pin_2: data.pin }

  - name: open_cell_2
    operation: open_cell
    actor: { actor_type: user, actor_id: "{{driver_id}}", channel: api }
    params: { order_id: "{{order_id_2}}", leg: pickup, pin: "{{pin_2}}" }
    expect: { status_code: 200 }
    wait_instance: true
    expect_instance: { status: COMPLETED }

  - name: close_cell_2
    operation: close_cell
    actor: { actor_type: user, actor_id: "{{driver_id}}", channel: api }
    params: { order_id: "{{order_id_2}}", leg: pickup }
    expect: { status_code: 200 }
    wait_instance: true
    expect_instance: { status: COMPLETED }

  # ----- заказ 3 -----
  - name: request_pin_3
    operation: request_locker_access_code
    actor: { actor_type: user, actor_id: "{{driver_id}}", channel: api }
    params: { order_id: "{{order_id_3}}", leg: pickup }
    expect: { status_code: 200 }
    capture: { pin_3: data.pin }

  - name: open_cell_3
    operation: open_cell
    actor: { actor_type: user, actor_id: "{{driver_id}}", channel: api }
    params: { order_id: "{{order_id_3}}", leg: pickup, pin: "{{pin_3}}" }
    expect: { status_code: 200 }
    wait_instance: true
    expect_instance: { status: COMPLETED }

  - name: close_cell_3
    operation: close_cell
    actor: { actor_type: user, actor_id: "{{driver_id}}", channel: api }
    params: { order_id: "{{order_id_3}}", leg: pickup }
    expect: { status_code: 200 }
    wait_instance: true
    expect_instance: { status: COMPLETED }

  - name: complete_loading
    operation: complete_loading
    actor: { actor_type: user, actor_id: "{{driver_id}}", channel: api }
    params:
      from_city: "{{from_city}}"
      to_city: "{{to_city}}"
    expect:
      status_code: 200
      body:
        data.trip_status: trip_assigned
    wait_instance: true
    expect_instance: { status: COMPLETED }
    capture:
      trip_id: data.trip_id
