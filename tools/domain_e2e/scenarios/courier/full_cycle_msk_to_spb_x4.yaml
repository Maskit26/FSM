# Полный цикл: 4 заказа Москва → Санкт-Петербург → order_completed.
#
#   1) courier / courier — курьер1 МСК сдаёт, курьер2 СПб выдаёт + confirm PIN
#   2) self / courier    — клиент сам сдаёт, курьер2 СПб выдаёт + confirm PIN
#   3) courier / self    — курьер1 МСК сдаёт, получатель сам забирает
#   4) self / self       — клиент сам сдаёт, получатель сам забирает
#
# Пары постаматов / размеры (не все P — по 3 ячейки размера на постамат):
#   1 P  POST1→POST2  Тверская → Невский
#   2 S  POST1→POST2  Тверская → Невский
#   3 M  POST3→POST4  Ленинградский → Лиговский
#   4 L  POST3→POST4  Ленинградский → Лиговский
#
# Актёры (users):
#   senders МСК: 3, 11, 12, 13
#   recipients СПб: 4, 14, 15, 16
#   courier1 МСК: 2, 7
#   courier2 СПб: 6, 8
#   driver: 1
#
# Перед прогоном: CALL clear_test_data(); + sql/platform/003_clear_test_runtime.sql
# Миграции: 015–019.

name: full_cycle_msk_to_spb_x4
service_id: svc_courier_01
vars:
  sender_1: "3"
  sender_2: "11"
  sender_3: "12"
  sender_4: "13"
  recipient_1: "4"
  recipient_2: "14"
  recipient_3: "15"
  recipient_4: "16"
  courier1_a: "2"
  courier1_b: "7"
  courier2_a: "6"
  courier2_b: "8"
  driver_id: "1"
defaults:
  poll_timeout: 90
  poll_interval: 0.5

steps:
  # ========== 1) courier / courier (POST1 → POST2) ==========
  - name: create_order_request_cc
    operation: create_order_request
    actor: { actor_type: user, actor_id: "{{sender_1}}", channel: api }
    params:
      from_address: "Москва, ул. Тверская, д. 1"
      to_address: "Санкт-Петербург, Невский пр., д. 1"
      cell_size: P
      parcel_type: документы
      sender_delivery: courier
      recipient_delivery: courier
      recipient_user_id: 4
    expect:
      status_code: 200
      body:
        data.status: PENDING
    capture: { request_cc: data.request_id }
    wait_instance: true
    expect_instance: { status: COMPLETED }

  - name: create_order_cc
    operation: create_order
    actor: { actor_type: user, actor_id: "{{sender_1}}", channel: api }
    params:
      request_id: "{{request_cc}}"
    expect:
      status_code: 200
      body:
        data.pickup_type: courier
        data.delivery_type: courier
    capture: { order_cc: data.order_id }

  - name: take_cc_pickup
    operation: take_courier_order
    actor: { actor_type: user, actor_id: "{{courier1_a}}", channel: api }
    params: { order_id: "{{order_cc}}", leg: pickup }
    expect: { status_code: 200 }
    wait_instance: true
    expect_instance: { status: COMPLETED }

  - name: pin_cc_pickup
    operation: request_locker_access_code
    actor: { actor_type: user, actor_id: "{{courier1_a}}", channel: api }
    params: { order_id: "{{order_cc}}", leg: pickup }
    expect: { status_code: 200 }
    capture: { pin_cc_pickup: data.pin }

  - name: open_cc_pickup
    operation: open_cell
    actor: { actor_type: user, actor_id: "{{courier1_a}}", channel: api }
    params: { order_id: "{{order_cc}}", leg: pickup, pin: "{{pin_cc_pickup}}" }
    expect: { status_code: 200 }
    wait_instance: true
    expect_instance: { status: COMPLETED }

  - name: close_cc_pickup
    operation: close_cell
    actor: { actor_type: user, actor_id: "{{courier1_a}}", channel: api }
    params: { order_id: "{{order_cc}}", leg: pickup }
    expect: { status_code: 200 }
    wait_instance: true
    expect_instance: { status: COMPLETED }

  # ========== 2) self / courier (POST1 → POST2) ==========
  - name: create_order_request_sc
    operation: create_order_request
    actor: { actor_type: user, actor_id: "{{sender_2}}", channel: api }
    params:
      from_address: "Москва, ул. Тверская, д. 1"
      to_address: "Санкт-Петербург, Невский пр., д. 1"
      cell_size: S
      parcel_type: документы
      sender_delivery: self
      recipient_delivery: courier
      recipient_user_id: 14
    expect:
      status_code: 200
