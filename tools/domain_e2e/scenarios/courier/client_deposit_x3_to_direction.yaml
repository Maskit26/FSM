# Клиент: 3 self-заказа → сдача в ячейки → попадание в direction.
#
# После close_cell каждый заказ: order_parcel_confirmed + bind на directions
# (Москва → Санкт-Петербург). Водительский сценарий — отдельно:
#   driver_loading_x3.yaml
#
# Сиды: user 3 = client.
# Нужны свободные ячейки S/M/L в МСК и СПб.
# Перед прогоном: CALL clear_test_data(); + чистка platform entity_fsm_state.

name: client_deposit_x3_to_direction
service_id: svc_courier_01
vars:
  client_id: "3"
defaults:
  poll_timeout: 60
  poll_interval: 0.5

steps:
  # ========== заказ 1 (S) ==========
  - name: create_order_request_1
    operation: create_order_request
    actor: { actor_type: user, actor_id: "{{client_id}}", channel: api }
    params:
      from_address: "Москва, ул. Тверская, д. 10"
      to_address: "Санкт-Петербург, Невский пр., д. 28"
      cell_size: S
      parcel_type: документы
      sender_delivery: self
      recipient_delivery: self
    expect:
      status_code: 200
      body:
        data.status: PENDING
    capture: { request_1: data.request_id }
    wait_instance: true
    expect_instance: { status: COMPLETED }

  - name: create_order_1
    operation: create_order
    actor: { actor_type: user, actor_id: "{{client_id}}", channel: api }
    params:
      request_id: "{{request_1}}"
    expect:
      status_code: 200
      body: { data.status: order_created }
    capture:
      order_id_1: data.order_id
      cell_1: data.source_cell_id

  - name: request_pin_1
    operation: request_locker_access_code
    actor: { actor_type: user, actor_id: "{{client_id}}", channel: api }
    params: { order_id: "{{order_id_1}}", leg: pickup }
    expect: { status_code: 200 }
    capture: { pin_1: data.pin }

  - name: open_cell_1
    operation: open_cell
    actor: { actor_type: user, actor_id: "{{client_id}}", channel: api }
    params: { order_id: "{{order_id_1}}", leg: pickup, pin: "{{pin_1}}" }
    expect: { status_code: 200 }
    wait_instance: true
    expect_instance: { status: COMPLETED }

  - name: close_cell_1
    operation: close_cell
    actor: { actor_type: user, actor_id: "{{client_id}}", channel: api }
    params: { order_id: "{{order_id_1}}", leg: pickup }
    expect: { status_code: 200 }
    wait_instance: true
    expect_instance: { status: COMPLETED }

  # ========== заказ 2 (M) ==========
  - name: create_order_request_2
    operation: create_order_request
    actor: { actor_type: user, actor_id: "{{client_id}}", channel: api }
    params:
      from_address: "Москва, ул. Тверская, д. 10"
      to_address: "Санкт-Петербург, Невский пр., д. 28"
      cell_size: M
      parcel_type: документы
      sender_delivery: self
      recipient_delivery: self
    expect:
      status_code: 200
      body:
        data.status: PENDING
    capture: { request_2: data.request_id }
    wait_instance: true
    expect_instance: { status: COMPLETED }

  - name: create_order_2
    operation: create_order
    actor: { actor_type: user, actor_id: "{{client_id}}", channel: api }
    params:
      request_id: "{{request_2}}"
    expect:
      status_code: 200
      body: { data.status: order_created }
    capture:
      order_id_2: data.order_id
      cell_2: data.source_cell_id

  - name: request_pin_2
    operation: request_locker_access_code
    actor: { actor_type: user, actor_id: "{{client_id}}", channel: api }
    params: { order_id: "{{order_id_2}}", leg: pickup }
    expect: { status_code: 200 }
    capture: { pin_2: data.pin }

  - name: open_cell_2
    operation: open_cell
    actor: { actor_type: user, actor_id: "{{client_id}}", channel: api }
    params: { order_id: "{{order_id_2}}", leg: pickup, pin: "{{pin_2}}" }
    expect: { status_code: 200 }
    wait_instance: true
    expect_instance: { status: COMPLETED }

  - name: close_cell_2
    operation: close_cell
    actor: { actor_type: user, actor_id: "{{client_id}}", channel: api }
    params: { order_id: "{{order_id_2}}", leg: pickup }
    expect: { status_code: 200 }
    wait_instance: true
    expect_instance: { status: COMPLETED }

  # ========== заказ 3 (L) ==========
  - name: create_order_request_3
    operation: create_order_request
    actor: { actor_type: user, actor_id: "{{client_id}}", channel: api }
    params:
      from_address: "Москва, ул. Тверская, д. 10"
      to_address: "Санкт-Петербург, Невский пр., д. 28"
      cell_size: L
      parcel_type: документы
      sender_delivery: self
      recipient_delivery: self
    expect:
      status_code: 200
      body:
        data.status: PENDING
    capture: { request_3: data.request_id }
    wait_instance: true
    expect_instance: { status: COMPLETED }

  - name: create_order_3
    operation: create_order
    actor: { actor_type: user, actor_id: "{{client_id}}", channel: api }
    params:
      request_id: "{{request_3}}"
    expect:
      status_code: 200
      body: { data.status: order_created }
    capture:
      order_id_3: data.order_id
      cell_3: data.source_cell_id

  - name: request_pin_3
    operation: request_locker_access_code
    actor: { actor_type: user, actor_id: "{{client_id}}", channel: api }
    params: { order_id: "{{order_id_3}}", leg: pickup }
    expect: { status_code: 200 }
    capture: { pin_3: data.pin }

  - name: open_cell_3
    operation: open_cell
    actor: { actor_type: user, actor_id: "{{client_id}}", channel: api }
    params: { order_id: "{{order_id_3}}", leg: pickup, pin: "{{pin_3}}" }
    expect: { status_code: 200 }
    wait_instance: true
    expect_instance: { status: COMPLETED }

  - name: close_cell_3
    operation: close_cell
    actor: { actor_type: user, actor_id: "{{client_id}}", channel: api }
    params: { order_id: "{{order_id_3}}", leg: pickup }
    expect: { status_code: 200 }
    wait_instance: true
    expect_instance: { status: COMPLETED }

  # Проверка: на бирже есть направление с ≥3 доступными
  - name: list_driver_exchange_sanity
    operation: list_driver_exchange
    actor: { actor_type: user, actor_id: "1", channel: api }
    params: { city: "Москва" }
    expect:
      status_code: 200
    capture:
      from_city: data.directions.0.from_city
      to_city: data.directions.0.to_city
