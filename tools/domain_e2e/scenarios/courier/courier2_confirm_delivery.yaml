# Курьер2: биржа → open/close → confirm PIN получателя → order_completed.
# Предусловие: delivery_type=courier заказ в order_parcel_confirmed_post2
# с recipient_user_id = client Москва (user 3). Курьер2 = user 2 Москва.
#
# Пример после разгрузки: order 1602.
#   UPDATE orders SET recipient_user_id=3 WHERE id=1602;
#
# Миграции: 018 + 019.

name: courier2_confirm_delivery
service_id: svc_courier_01
vars:
  courier_id: "2"
  recipient_id: "3"
  order_id: "1602"
defaults:
  poll_timeout: 60
  poll_interval: 0.5

steps:
  - name: list_courier_exchange
    operation: list_courier_exchange
    actor: { actor_type: user, actor_id: "{{courier_id}}", channel: api }
    params: {}
    expect: { status_code: 200 }

  - name: take_courier_order
    operation: take_courier_order
    actor: { actor_type: user, actor_id: "{{courier_id}}", channel: api }
    params: { order_id: "{{order_id}}", leg: delivery }
    expect: { status_code: 200 }
    wait_instance: true
    expect_instance: { status: COMPLETED }

  - name: request_pin_courier2
    operation: request_locker_access_code
    actor: { actor_type: user, actor_id: "{{courier_id}}", channel: api }
    params: { order_id: "{{order_id}}", leg: delivery }
    expect: { status_code: 200 }
    capture: { pin_cell: data.pin }

  - name: open_cell_courier2
    operation: open_cell
    actor: { actor_type: user, actor_id: "{{courier_id}}", channel: api }
    params:
      order_id: "{{order_id}}"
      leg: delivery
      pin: "{{pin_cell}}"
    expect: { status_code: 200 }
    wait_instance: true
    expect_instance: { status: COMPLETED }

  - name: close_cell_courier2
    operation: close_cell
    actor: { actor_type: user, actor_id: "{{courier_id}}", channel: api }
    params: { order_id: "{{order_id}}", leg: delivery }
    expect: { status_code: 200 }
    wait_instance: true
    expect_instance: { status: COMPLETED }

  - name: request_pin_recipient
    operation: request_locker_access_code
    actor: { actor_type: user, actor_id: "{{recipient_id}}", channel: api }
    params: { order_id: "{{order_id}}", leg: delivery }
    expect: { status_code: 200 }
    capture: { pin_confirm: data.pin }

  - name: confirm_courier2_delivery
    operation: confirm_courier2_delivery
    actor: { actor_type: user, actor_id: "{{courier_id}}", channel: api }
    params: { order_id: "{{order_id}}", pin: "{{pin_confirm}}" }
    expect: { status_code: 200 }
    wait_instance: true
    expect_instance: { status: COMPLETED }
